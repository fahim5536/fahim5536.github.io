<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="nimbusTitle nimbusDesc">
  <title id="nimbusTitle">Nimbus Dashboard interface placeholder</title>
  <desc id="nimbusDesc">A calm analytics dashboard in cream and sage with a line chart and metric cards.</desc>
  <defs>
    <linearGradient id="nBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8DFD0"/>
      <stop offset="1" stop-color="#DCD1BE"/>
    </linearGradient>
    <linearGradient id="nChart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7D8471" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7D8471" stop-opacity="0"/>
    </linearGradient>
    <filter id="nShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2B2A27" flood-opacity="0.16"/>
    </filter>
    <filter id="nGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#nBg)"/>
  <circle cx="1090" cy="110" r="220" fill="#F5F1EA" opacity="0.5"/>

  <g transform="translate(150 168)" filter="url(#nShadow)">
    <rect width="900" height="564" rx="18" fill="#F5F1EA"/>
    <rect x="1" y="1" width="898" height="562" rx="17" fill="none" stroke="#2B2A27" stroke-opacity="0.08"/>

    <!-- sidebar -->
    <path d="M0 18A18 18 0 0 1 18 0h150v564H18a18 18 0 0 1-18-18z" fill="#2B2A27"/>
    <circle cx="34" cy="36" r="10" fill="#7D8471"/>
    <text x="54" y="41" font-family="Georgia, serif" font-size="17" fill="#F5F1EA">Nimbus</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#A9A69E">
      <rect x="20" y="92" width="112" height="34" rx="8" fill="#3A3935"/>
      <text x="36" y="113" fill="#F5F1EA">Overview</text>
      <text x="36" y="157">Reports</text>
      <text x="36" y="197">Audience</text>
      <text x="36" y="237">Settings</text>
    </g>
    <line x1="0" y1="0" x2="0" y2="564" stroke="#F5F1EA" stroke-opacity="0.06"/>

    <!-- header -->
    <text x="196" y="58" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A27">Performance</text>
    <text x="196" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8A857C">Last 30 days</text>
    <rect x="742" y="38" width="112" height="34" rx="17" fill="#EDE6DA"/>
    <text x="798" y="59" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5D6553">Export</text>

    <!-- metric cards -->
    <g>
      <rect x="196" y="112" width="208" height="96" rx="12" fill="#EDE6DA"/>
      <text x="216" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="#6E6A62">VISITORS</text>
      <text x="216" y="176" font-family="Georgia, serif" font-size="28" fill="#2B2A27">24,801</text>
      <text x="216" y="194" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5D6553">+12.4% this month</text>
    </g>
    <g>
      <rect x="420" y="112" width="208" height="96" rx="12" fill="#EDE6DA"/>
      <text x="440" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="#6E6A62">SESSION TIME</text>
      <text x="440" y="176" font-family="Georgia, serif" font-size="28" fill="#2B2A27">4m 12s</text>
      <text x="440" y="194" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5D6553">+0.8s vs last month</text>
    </g>
    <g>
      <rect x="644" y="112" width="210" height="96" rx="12" fill="#7D8471"/>
      <text x="664" y="140" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="#E8DFD0">CONVERSION</text>
      <text x="664" y="176" font-family="Georgia, serif" font-size="28" fill="#F5F1EA">3.8%</text>
      <text x="664" y="194" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#DCE0D2">+0.6 pts</text>
    </g>

    <!-- chart -->
    <rect x="196" y="232" width="658" height="296" rx="12" fill="#FBF8F2" stroke="#2B2A27" stroke-opacity="0.07"/>
    <g stroke="#2B2A27" stroke-opacity="0.06">
      <line x1="224" y1="300" x2="826" y2="300"/>
      <line x1="224" y1="360" x2="826" y2="360"/>
      <line x1="224" y1="420" x2="826" y2="420"/>
      <line x1="224" y1="480" x2="826" y2="480"/>
    </g>
    <path d="M224 470C286 440 316 452 360 418s76-38 112-24 66-42 108-58 76 18 110-10 54-46 112-42v226H224z" fill="url(#nChart)"/>
    <path d="M224 470C286 440 316 452 360 418s76-38 112-24 66-42 108-58 76 18 110-10 54-46 112-42" fill="none" stroke="#5D6553" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="802" cy="284" r="5" fill="#5D6553"/>
    <circle cx="802" cy="284" r="10" fill="#5D6553" opacity="0.16"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8A857C">
      <text x="224" y="510">SEP 01</text>
      <text x="500" y="510">SEP 15</text>
      <text x="778" y="510">SEP 30</text>
    </g>
  </g>

  <rect width="1200" height="900" filter="url(#nGrain)"/>
</svg>
